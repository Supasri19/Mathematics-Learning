<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมคณิตศาสตร์ 3D</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
        body {
            box-sizing: border-box;
        }
        
        .shape-visual {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }
        
        .pyramid {
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 60px solid #ffffff;
            position: relative;
        }
        
        .pyramid::after {
            content: '';
            position: absolute;
            top: 60px;
            left: -30px;
            width: 60px;
            height: 20px;
            background: #e0e0e0;
            border-radius: 50%;
        }
        
        .cone {
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 70px solid #ffffff;
            border-radius: 0 0 50% 50%;
            position: relative;
        }
        
        .cone::after {
            content: '';
            position: absolute;
            top: 70px;
            left: -35px;
            width: 70px;
            height: 15px;
            background: #e0e0e0;
            border-radius: 50%;
        }
        
        .sphere {
            width: 80px;
            height: 80px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1);
        }
        
        .formula-display {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-weight: 600;
            text-align: center;
            margin: 16px 0;
        }
        
        .score-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 12px;
            padding: 16px;
            color: white;
            text-align: center;
            font-weight: 600;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="min-h-full bg-gradient-to-br from-purple-100 to-blue-100">
  <script>
        // Configuration
        const defaultConfig = {
            game_title: "เกมคณิตศาสตร์ 3D",
            instruction_text: "คำนวณพื้นที่ผิวและปริมาตรของรูปทรงต่างๆ",
            new_question_text: "โจทย์ใหม่",
            submit_answer_text: "ตรวจคำตอบ",
            background_color: "#f3e8ff",
            surface_color: "#ffffff",
            text_color: "#1f2937",
            primary_action_color: "#8b5cf6",
            secondary_action_color: "#6366f1"
        };

        // Game state
        let currentQuestion = null;
        let gameStats = { correct: 0, total: 0 };
        let gameHistory = [];

        // Shape definitions
        const shapes = {
            pyramid: {
                name: "พีระมิด",
                surfaceArea: (base, height, l) => base * base + 2 * base * l,
                volume: (base, height) => (1/3) * base * base * height,
                formulas: {
                    surface: "พื้นที่ผิว = ฐาน² + 2 × ฐาน × ความสูงเอียง",
                    volume: "ปริมาตร = (1/3) × ฐาน² × สูง"
                }
            },
            cone: {
                name: "กรวย",
                surfaceArea: (radius, height, l) => Math.PI * radius * radius + Math.PI * radius * l,
                volume: (radius, height) => (1/3) * Math.PI * radius * radius * height,
                formulas: {
                    surface: "พื้นที่ผิว = πr² + πrl",
                    volume: "ปริมาตร = (1/3) × πr² × h"
                }
            },
            sphere: {
                name: "ทรงกลม",
                surfaceArea: (radius) => 4 * Math.PI * radius * radius,
                volume: (radius) => (4/3) * Math.PI * radius * radius * radius,
                formulas: {
                    surface: "พื้นที่ผิว = 4πr²",
                    volume: "ปริมาตร = (4/3) × πr³"
                }
            }
        };

        // Data SDK handler
        const dataHandler = {
            onDataChanged(data) {
                gameHistory = data;
                updateStats();
            }
        };

        // Generate random question
        function generateQuestion() {
            const shapeNames = Object.keys(shapes);
            const shapeName = shapeNames[Math.floor(Math.random() * shapeNames.length)];
            const shape = shapes[shapeName];
            const questionTypes = ['surface', 'volume'];
            const questionType = questionTypes[Math.floor(Math.random() * questionTypes.length)];
            
            let dimensions, answer, questionText;
            
            if (shapeName === 'pyramid') {
                const base = Math.floor(Math.random() * 8) + 3; // 3-10
                const height = Math.floor(Math.random() * 8) + 3; // 3-10
                const l = Math.sqrt(height * height + (base/2) * (base/2));
                
                dimensions = { base, height, l };
                
                if (questionType === 'surface') {
                    answer = Math.round(shape.surfaceArea(base, height, l) * 100) / 100;
                    questionText = `พีระมิดฐานสี่เหลี่ยมจัตุรัส ฐาน ${base} ซม. สูง ${height} ซม. จงหาพื้นที่ผิว`;
                } else {
                    answer = Math.round(shape.volume(base, height) * 100) / 100;
                    questionText = `พีระมิดฐานสี่เหลี่ยมจัตุรัส ฐาน ${base} ซม. สูง ${height} ซม. จงหาปริมาตร`;
                }
            } else if (shapeName === 'cone') {
                const radius = Math.floor(Math.random() * 6) + 2; // 2-7
                const height = Math.floor(Math.random() * 8) + 3; // 3-10
                const l = Math.sqrt(height * height + radius * radius);
                
                dimensions = { radius, height, l };
                
                if (questionType === 'surface') {
                    answer = Math.round(shape.surfaceArea(radius, height, l) * 100) / 100;
                    questionText = `กรวยรัศมี ${radius} ซม. สูง ${height} ซม. จงหาพื้นที่ผิว`;
                } else {
                    answer = Math.round(shape.volume(radius, height) * 100) / 100;
                    questionText = `กรวยรัศมี ${radius} ซม. สูง ${height} ซม. จงหาปริมาตร`;
                }
            } else { // sphere
                const radius = Math.floor(Math.random() * 6) + 2; // 2-7
                
                dimensions = { radius };
                
                if (questionType === 'surface') {
                    answer = Math.round(shape.surfaceArea(radius) * 100) / 100;
                    questionText = `ทรงกลมรัศมี ${radius} ซม. จงหาพื้นที่ผิว`;
                } else {
                    answer = Math.round(shape.volume(radius) * 100) / 100;
                    questionText = `ทรงกลมรัศมี ${radius} ซม. จงหาปริมาตร`;
                }
            }
            
            return {
                id: Date.now().toString(),
                shape: shapeName,
                questionType,
                questionText,
                dimensions,
                answer,
                formula: shape.formulas[questionType]
            };
        }

        // Display question
        function displayQuestion() {
            currentQuestion = generateQuestion();
            
            const questionContainer = document.getElementById('question-container');
            const shapeVisual = getShapeVisual(currentQuestion.shape);
            
            questionContainer.innerHTML = `
                <div class="text-center mb-6">
                    <div class="shape-visual mb-4">
                        ${shapeVisual}
                    </div>
                    <h3 class="text-xl font-bold mb-2" style="color: ${window.elementSdk?.config?.text_color || defaultConfig.text_color}">${currentQuestion.questionText}</h3>
                    <div class="formula-display">
                        ${currentQuestion.formula}
                    </div>
                </div>
                
                <div class="flex flex-col items-center space-y-4">
                    <input type="number" 
                           id="answer-input" 
                           step="0.01"
                           placeholder="ใส่คำตอบ (ทศนิยม 2 ตำแหน่ง)"
                           class="w-full max-w-xs px-4 py-3 text-center text-lg border-2 border-gray-300 rounded-lg focus:border-purple-500 focus:outline-none"
                           style="background-color: ${window.elementSdk?.config?.surface_color || defaultConfig.surface_color}; color: ${window.elementSdk?.config?.text_color || defaultConfig.text_color}">
                    
                    <button id="submit-btn" 
                            onclick="checkAnswer()"
                            class="px-8 py-3 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200"
                            style="background-color: ${window.elementSdk?.config?.primary_action_color || defaultConfig.primary_action_color}">
                        ${window.elementSdk?.config?.submit_answer_text || defaultConfig.submit_answer_text}
                    </button>
                </div>
                
                <div id="result-message" class="mt-4 text-center"></div>
            `;
            
            // Add enter key support
            document.getElementById('answer-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkAnswer();
                }
            });
        }

        // Get shape visual
        function getShapeVisual(shapeName) {
            const visuals = {
                pyramid: '<div class="pyramid"></div>',
                cone: '<div class="cone"></div>',
                sphere: '<div class="sphere"></div>'
            };
            return visuals[shapeName];
        }

        // Check answer
        async function checkAnswer() {
            const answerInput = document.getElementById('answer-input');
            const submitBtn = document.getElementById('submit-btn');
            const resultMessage = document.getElementById('result-message');
            
            if (!answerInput.value) {
                resultMessage.innerHTML = '<p class="text-red-500 font-semibold">กรุณาใส่คำตอบ</p>';
                return;
            }
            
            // Show loading state
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'กำลังตรวจ...';
            
            const userAnswer = parseFloat(answerInput.value);
            const isCorrect = Math.abs(userAnswer - currentQuestion.answer) < 0.1;
            
            // Save to data SDK
            const result = await window.dataSdk.create({
                id: currentQuestion.id,
                shape: currentQuestion.shape,
                question_type: currentQuestion.questionType,
                user_answer: userAnswer,
                correct_answer: currentQuestion.answer,
                is_correct: isCorrect,
                timestamp: new Date().toISOString()
            });
            
            if (result.isOk) {
                gameStats.total++;
                if (isCorrect) gameStats.correct++;
                
                // Show result
                if (isCorrect) {
                    resultMessage.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
                            <p class="font-semibold">🎉 ถูกต้อง!</p>
                            <p>คำตอบที่ถูกต้อง: ${currentQuestion.answer}</p>
                        </div>
                    `;
                } else {
                    resultMessage.innerHTML = `
                        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">
                            <p class="font-semibold">❌ ไม่ถูกต้อง</p>
                            <p>คำตอบของคุณ: ${userAnswer}</p>
                            <p>คำตอบที่ถูกต้อง: ${currentQuestion.answer}</p>
                        </div>
                    `;
                }
                
                updateStats();
            } else {
                resultMessage.innerHTML = '<p class="text-red-500">เกิดข้อผิดพลาดในการบันทึกคำตอบ</p>';
            }
            
            // Reset button
            submitBtn.classList.remove('loading');
            submitBtn.textContent = window.elementSdk?.config?.submit_answer_text || defaultConfig.submit_answer_text;
        }

        // Update statistics
        function updateStats() {
            const percentage = gameStats.total > 0 ? Math.round((gameStats.correct / gameStats.total) * 100) : 0;
            document.getElementById('stats').innerHTML = `
                <div class="score-card">
                    <p class="text-lg">คะแนน: ${gameStats.correct}/${gameStats.total}</p>
                    <p class="text-sm">ความแม่นยำ: ${percentage}%</p>
                </div>
            `;
        }

        // New question
        function newQuestion() {
            displayQuestion();
        }

        // Element SDK configuration
        async function onConfigChange(config) {
            // Update title
            const titleElement = document.getElementById('game-title');
            if (titleElement) {
                titleElement.textContent = config.game_title || defaultConfig.game_title;
            }
            
            // Update instruction
            const instructionElement = document.getElementById('instruction');
            if (instructionElement) {
                instructionElement.textContent = config.instruction_text || defaultConfig.instruction_text;
            }
            
            // Update button text
            const newQuestionBtn = document.getElementById('new-question-btn');
            if (newQuestionBtn) {
                newQuestionBtn.textContent = config.new_question_text || defaultConfig.new_question_text;
            }
            
            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) {
                submitBtn.textContent = config.submit_answer_text || defaultConfig.submit_answer_text;
            }
            
            // Update colors
            document.body.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color}, #ddd6fe)`;
            
            const surfaceElements = document.querySelectorAll('.bg-white, input');
            surfaceElements.forEach(el => {
                el.style.backgroundColor = config.surface_color || defaultConfig.surface_color;
            });
            
            const textElements = document.querySelectorAll('h1, h2, h3, p, label');
            textElements.forEach(el => {
                el.style.color = config.text_color || defaultConfig.text_color;
            });
            
            const primaryButtons = document.querySelectorAll('#submit-btn');
            primaryButtons.forEach(btn => {
                btn.style.backgroundColor = config.primary_action_color || defaultConfig.primary_action_color;
            });
            
            const secondaryButtons = document.querySelectorAll('#new-question-btn');
            secondaryButtons.forEach(btn => {
                btn.style.backgroundColor = config.secondary_action_color || defaultConfig.secondary_action_color;
            });
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [
                    {
                        get: () => config.background_color || defaultConfig.background_color,
                        set: (value) => {
                            config.background_color = value;
                            window.elementSdk.setConfig({ background_color: value });
                        }
                    },
                    {
                        get: () => config.surface_color || defaultConfig.surface_color,
                        set: (value) => {
                            config.surface_color = value;
                            window.elementSdk.setConfig({ surface_color: value });
                        }
                    },
                    {
                        get: () => config.text_color || defaultConfig.text_color,
                        set: (value) => {
                            config.text_color = value;
                            window.elementSdk.setConfig({ text_color: value });
                        }
                    },
                    {
                        get: () => config.primary_action_color || defaultConfig.primary_action_color,
                        set: (value) => {
                            config.primary_action_color = value;
                            window.elementSdk.setConfig({ primary_action_color: value });
                        }
                    },
                    {
                        get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                        set: (value) => {
                            config.secondary_action_color = value;
                            window.elementSdk.setConfig({ secondary_action_color: value });
                        }
                    }
                ],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["game_title", config.game_title || defaultConfig.game_title],
                ["instruction_text", config.instruction_text || defaultConfig.instruction_text],
                ["new_question_text", config.new_question_text || defaultConfig.new_question_text],
                ["submit_answer_text", config.submit_answer_text || defaultConfig.submit_answer_text]
            ]);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize Data SDK
            const dataResult = await window.dataSdk.init(dataHandler);
            if (!dataResult.isOk) {
                console.error('Failed to initialize data SDK');
            }
            
            // Initialize Element SDK
            if (window.elementSdk) {
                await window.elementSdk.init({
                    defaultConfig,
                    onConfigChange,
                    mapToCapabilities,
                    mapToEditPanelValues
                });
            }
            
            // Start first question
            displayQuestion();
            updateStats();
        });
    </script>
  <main class="container mx-auto px-4 py-8 max-w-4xl">
   <header class="text-center mb-8">
    <h1 id="game-title" class="text-4xl font-bold mb-4" style="color: #1f2937">เกมคณิตศาสตร์ 3D</h1>
    <p id="instruction" class="text-lg text-gray-600 mb-6">คำนวณพื้นที่ผิวและปริมาตรของรูปทรงต่างๆ</p>
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center mb-6"><button id="new-question-btn" onclick="newQuestion()" class="px-6 py-3 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-200" style="background-color: #6366f1"> โจทย์ใหม่ </button>
     <div id="stats"></div>
    </div>
   </header>
   <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
    <div id="question-container"><!-- Question will be loaded here -->
    </div>
   </div>
   <div class="text-center text-sm text-gray-500">
    <p>💡 เคล็ดลับ: ใช้ π ≈ 3.14159 ในการคำนวณ</p>
   </div>
  </main>
